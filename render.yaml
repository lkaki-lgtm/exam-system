services:
  - type: web
    name: online-exam-system
    runtime: ruby
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: online-exam-db
          property: connectionString

databases:
  - name: online-exam-db
    plan: free